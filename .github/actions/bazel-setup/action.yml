name: "Bazel setup"
description: "Installs the Android SDK packages the Bazel build needs and Bazelisk, and restores the repository cache, the Go repositories and the disk cache main saved."

inputs:
  disk-cache:
    description: "Restore the disk cache (action outputs). Analysis-only jobs don't need it."
    required: false
    default: "true"

runs:
  using: "composite"
  steps:
    # The runner image's SDK lacks the minor platform (compileSdk 37.2) and build-tools 37. The
    # download (~9 s) runs in the background while the caches restore; the last step waits for it.
    - name: "Install Android SDK packages (in the background)"
      shell: bash
      run: |
        sdk_log="$RUNNER_TEMP/sdkmanager.log"
        echo "SDKMANAGER_LOG=$sdk_log" >> "$GITHUB_ENV"
        nohup bash -c '
          # `yes` exits on SIGPIPE once sdkmanager stops reading.
          (yes || true) | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null &&
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.2" "build-tools;37.0.0"
          echo $? > "$0.exit"
        ' "$sdk_log" > "$sdk_log" 2>&1 &

    # Bazelisk reads .bazelversion. Its cache is saved only from main.
    - uses: bazel-contrib/setup-bazel@0.19.2
      with:
        bazelisk-cache: true
        cache-save: ${{ github.event_name != 'pull_request' }}

    # Both caches are restored here and saved by bazel-cache-save, which only the Unit Tests job
    # runs, on pushes to main: it builds all of //..., so its caches serve every job, and pull
    # requests can't evict each other's entries. The Actions cache holds 10 GB per repository.
    #
    # The repository cache (downloads) is keyed by the files that pin them. The disk cache (action
    # outputs) changes with every commit, so each job restores the newest one main saved.
    - name: "Cache keys"
      shell: bash
      run: |
        echo "BAZEL_REPOSITORY_CACHE_KEY=bazel-repo-v1-$RUNNER_OS-${{ hashFiles('MODULE.bazel', 'MODULE.bazel.lock', 'maven_install.json', 'maven_jvm_test_variants_install.json', 'maven_automobile_install.json', 'bazel/jdk/extensions.bzl') }}" >> "$GITHUB_ENV"
        echo "BAZEL_DISK_CACHE_KEY=bazel-disk-v1-$RUNNER_OS-$GITHUB_SHA" >> "$GITHUB_ENV"
        echo "BAZEL_GO_REPOS_CACHE_KEY=bazel-go-repos-v1-$RUNNER_OS-${{ hashFiles('MODULE.bazel.lock') }}" >> "$GITHUB_ENV"

    # Downloads only: Bazel 9 also keeps every fetched repository extracted in <repository
    # cache>/contents, which doubles the cache (2.2 GB instead of 1.3 GB) to save ~7 s of unpacking
    # in a job, less than restoring the extra gigabyte takes.
    - name: "Point Bazel at the repository cache"
      shell: bash
      run: |
        echo "common --repository_cache=$HOME/.cache/bazel-repo" >> "$HOME/.bazelrc"
        echo "common --repo_contents_cache=" >> "$HOME/.bazelrc"

    - name: "Restore repository cache"
      id: repository-cache
      uses: actions/cache/restore@v5
      with:
        path: ~/.cache/bazel-repo
        key: ${{ env.BAZEL_REPOSITORY_CACHE_KEY }}
        restore-keys: bazel-repo-v1-${{ runner.os }}-

    - name: "Record repository cache hit"
      shell: bash
      run: echo "BAZEL_REPOSITORY_CACHE_HIT=${{ steps.repository-cache.outputs.cache-hit }}" >> "$GITHUB_ENV"

    # rules_android's tools are Go programs: analyzing an Android target fetches the Go SDK and
    # Gazelle's go_repository modules, which Gazelle builds its fetch tool for with `go build`
    # (~13 s of a CI job's analysis, which the repository cache doesn't save). setup-bazel puts the
    # output base in ~/.bazel, the same path in every job, so Bazel reuses these restored
    # repositories as long as their markers match, and refetches any that don't.
    - name: "Restore Go repositories"
      id: go-repos-cache
      uses: actions/cache/restore@v5
      with:
        path: |
          ~/.bazel/external/gazelle++*
          ~/.bazel/external/@gazelle++*.marker
          ~/.bazel/external/rules_go++go_sdk+*
          ~/.bazel/external/@rules_go++go_sdk+*.marker
        key: ${{ env.BAZEL_GO_REPOS_CACHE_KEY }}
        restore-keys: bazel-go-repos-v1-${{ runner.os }}-

    - name: "Record Go repositories cache hit"
      shell: bash
      run: echo "BAZEL_GO_REPOS_CACHE_HIT=${{ steps.go-repos-cache.outputs.cache-hit }}" >> "$GITHUB_ENV"

    - name: "Point Bazel at the disk cache"
      if: inputs.disk-cache == 'true'
      shell: bash
      run: echo "build --disk_cache=$HOME/.cache/bazel-disk" >> "$HOME/.bazelrc"

    - name: "Restore disk cache"
      if: inputs.disk-cache == 'true'
      uses: actions/cache/restore@v5
      with:
        path: ~/.cache/bazel-disk
        key: ${{ env.BAZEL_DISK_CACHE_KEY }}
        restore-keys: bazel-disk-v1-${{ runner.os }}-

    # Bazel refreshes the mtime of every cache entry it reads or writes, so entries older than this
    # marker when the job ends weren't used by the build (bazel-cache-save prunes them).
    - name: "Mark the start of the build"
      shell: bash
      run: touch "$RUNNER_TEMP/bazel-cache-marker"

    - name: "Wait for the Android SDK packages"
      shell: bash
      run: |
        while [[ ! -f "$SDKMANAGER_LOG.exit" ]]; do sleep 0.2; done
        status=$(cat "$SDKMANAGER_LOG.exit")
        if [[ "$status" != 0 ]]; then
          cat "$SDKMANAGER_LOG"
          exit "$status"
        fi
