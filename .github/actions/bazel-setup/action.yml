name: "Bazel setup"
description: "Installs the Android SDK packages the Bazel build needs and Bazelisk, and restores the repository cache and the disk cache main saved."

inputs:
  disk-cache:
    description: "Restore the disk cache (action outputs). Analysis-only jobs don't need it."
    required: false
    default: "true"

runs:
  using: "composite"
  steps:
    # The runner image's SDK lacks the minor platform (compileSdk 37.2) and build-tools 37.
    - name: "Install Android SDK packages"
      shell: bash
      run: |
        # `yes` exits on SIGPIPE once sdkmanager stops reading, which pipefail would report.
        (yes || true) | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
        "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.2" "build-tools;37.0.0"

    # Bazelisk reads .bazelversion. Its cache is saved only from main.
    - uses: bazel-contrib/setup-bazel@0.19.2
      with:
        bazelisk-cache: true
        cache-save: ${{ github.event_name != 'pull_request' }}

    # Both caches are restored here and saved by bazel-cache-save, which only the Unit Tests job
    # runs, on pushes to main: it builds all of //..., so its caches serve every job, and pull
    # requests can't evict each other's entries. The Actions cache holds 10 GB per repository.
    #
    # The repository cache (downloads) is keyed by the files that pin them. The disk cache (action
    # outputs) changes with every commit, so each job restores the newest one main saved.
    - name: "Cache keys"
      shell: bash
      run: |
        echo "BAZEL_REPOSITORY_CACHE_KEY=bazel-repo-v1-$RUNNER_OS-${{ hashFiles('MODULE.bazel', 'MODULE.bazel.lock', 'maven_install.json', 'maven_jvm_test_variants_install.json', 'bazel/jdk/extensions.bzl') }}" >> "$GITHUB_ENV"
        echo "BAZEL_DISK_CACHE_KEY=bazel-disk-v1-$RUNNER_OS-$GITHUB_SHA" >> "$GITHUB_ENV"

    # Downloads only: Bazel 9 also keeps every fetched repository extracted in <repository
    # cache>/contents, which doubles the cache (2.2 GB instead of 1.3 GB) to save ~7 s of unpacking
    # in a job, less than restoring the extra gigabyte takes.
    - name: "Point Bazel at the repository cache"
      shell: bash
      run: |
        echo "common --repository_cache=$HOME/.cache/bazel-repo" >> "$HOME/.bazelrc"
        echo "common --repo_contents_cache=" >> "$HOME/.bazelrc"

    - name: "Restore repository cache"
      id: repository-cache
      uses: actions/cache/restore@v5
      with:
        path: ~/.cache/bazel-repo
        key: ${{ env.BAZEL_REPOSITORY_CACHE_KEY }}
        restore-keys: bazel-repo-v1-${{ runner.os }}-

    - name: "Record repository cache hit"
      shell: bash
      run: echo "BAZEL_REPOSITORY_CACHE_HIT=${{ steps.repository-cache.outputs.cache-hit }}" >> "$GITHUB_ENV"

    - name: "Point Bazel at the disk cache"
      if: inputs.disk-cache == 'true'
      shell: bash
      run: echo "build --disk_cache=$HOME/.cache/bazel-disk" >> "$HOME/.bazelrc"

    - name: "Restore disk cache"
      if: inputs.disk-cache == 'true'
      uses: actions/cache/restore@v5
      with:
        path: ~/.cache/bazel-disk
        key: ${{ env.BAZEL_DISK_CACHE_KEY }}
        restore-keys: bazel-disk-v1-${{ runner.os }}-

    # Bazel refreshes the mtime of every cache entry it reads or writes, so entries older than this
    # marker when the job ends weren't used by the build (bazel-cache-save prunes them).
    - name: "Mark the start of the build"
      shell: bash
      run: touch "$RUNNER_TEMP/bazel-cache-marker"
