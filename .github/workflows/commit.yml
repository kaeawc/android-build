name: "Commit"


on:
  pull_request:
    branches:
      - '*'
  push:
    branches:
      - main

permissions:
  checks: write
  security-events: write
  pull-requests: write

jobs:
  # Bazel builds, tests and packages the app; Gradle stays for Android Studio (Android Platform),
  # Android Lint, and the AutoMobile device tests. Job names are the required checks of the
  # "Green Main" ruleset, so they stay stable.

  android-platform:
    name: "Android Platform"
    runs-on: ubuntu-latest
    steps:
      - name: "Git Checkout"
        uses: actions/checkout@v7

      # The Gradle build is what Android Studio syncs: realizing every task proves it still
      # configures on the current AGP / Kotlin / JDK.
      - uses: ./.github/actions/gradle-task-run
        with:
          gradle-tasks: "tasks"
          reuse-configuration-cache: true
          gradle-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

  unit-tests:
    name: "Unit Tests"
    runs-on: ubuntu-latest
    steps:
      - name: "Git Checkout"
        uses: actions/checkout@v7

      - uses: ./.github/actions/bazel-setup
        with:
          disk-cache: unit-tests

      - name: "bazel test //..."
        run: bazel test --config=ci //...

      - name: "Store test logs"
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: bazel-testlogs
          path: bazel-testlogs/**/test.log

  validate-xml:
    name: "Validate XML"
    runs-on: ubuntu-latest
    steps:
      - name: "Git Checkout"
        uses: actions/checkout@v7

      - name: "Run XMLStarlet"
        shell: "bash"
        run: |
          sudo apt-get update
          sudo apt-get install xmlstarlet
          ci/validate_xml.sh

  ktfmt:
    name: "ktfmt"
    runs-on: ubuntu-latest
    steps:
      - name: "Git Checkout"
        uses: actions/checkout@v7

      - name: "Run ktfmt"
        shell: "bash"
        run: |
          INSTALL_KTFMT_WHEN_MISSING=true ONLY_TOUCHED_FILES=false ci/validate_ktfmt.sh

  validate-shell-scripts:
    name: "Validate Shell Scripts"
    runs-on: ubuntu-latest
    steps:
      - name: "Git Checkout"
        uses: actions/checkout@v7

      - name: "Run ShellCheck"
        shell: "bash"
        run: |
          ci/validate_shell_scripts.sh

  module-graph:
    name: "Module Graph Check"
    runs-on: ubuntu-latest
    steps:
      - name: "Git Checkout"
        uses: actions/checkout@v7

      - uses: ./.github/actions/bazel-setup
        with:
          disk-cache: module-graph

      # bazel/defs.bzl gives each layer a visibility, so analysis fails on a dependency the
      # module graph doesn't allow (e.g. feature -> feature).
      - name: "Analyze the module graph"
        run: bazel build --config=ci --nobuild //...

      # Formatting, lint, and sorted dependency lists in BUILD / .bzl / MODULE.bazel files.
      - name: "buildifier"
        run: bazel run --config=ci //bazel:buildifier_check

  dependency-versions:
    name: "Dependency Versions"
    runs-on: ubuntu-latest
    steps:
      - name: "Git Checkout"
        uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: "zulu"
          java-version: "27"

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      # Bazel must resolve the versions Gradle does (bazel/scripts/repin.py): fails when an
      # artifact resolves older in maven_install.json, or MODULE.bazel and the catalog drifted.
      - name: "Bazel and Gradle resolve the same versions"
        run: python3 bazel/scripts/repin.py --check

  android-lint:
    name: "Android Lint"
    runs-on: ubuntu-latest
    steps:
      - name: "Git Checkout"
        uses: actions/checkout@v7

      - uses: ./.github/actions/gradle-task-run
        with:
          gradle-tasks: ":app:lintRelease -Plint-config='all'"
          reuse-configuration-cache: true
          malloc-replacement: "tcmalloc"

      - name: "Merge Lint SARIF results & Move HTML report"
        shell: "bash"
        run: |
          mkdir -p build/reports
          find . | grep "lint-results.sarif" | xargs jq -s '{ "$schema": "https://json.schemastore.org/sarif-2.1.0", "version": "2.1.0", "runs": map(.runs) | add }'  > build/reports/merged-lint.sarif
          mv app/build/reports/lint-results-release.html build/reports/lint-results.html

      - name: "Store Android Lint SARIF Report"
        uses: github/codeql-action/upload-sarif@v4
        if: success()
        with:
          sarif_file: build/reports/merged-lint.sarif

      - name: "Store Android Lint HTML Report"
        uses: actions/upload-artifact@v7
        if: success()
        with:
          name: android-lint-default-report
          path: |
            build/reports/lint-results.html

  build-apk:
    name: "Build APK"
    runs-on: ubuntu-latest
    steps:
      - name: "Git Checkout"
        uses: actions/checkout@v7

      - uses: ./.github/actions/bazel-setup
        with:
          disk-cache: apk

      - name: "bazel build //app"
        run: |
          bazel build --config=ci //app
          mkdir -p out && cp bazel-bin/app/app.apk out/app-debug.apk

      - name: "Store APK"
        uses: actions/upload-artifact@v7
        with:
          name: apk
          path: out/app-debug.apk

  build-base-apk:
    name: "Build Base APK"
    if: github.ref_name != 'main'
    runs-on: ubuntu-latest
    steps:
      # The PR's checkout provides the CI actions; the base commit is built in base/.
      - name: "Git Checkout"
        uses: actions/checkout@v7

      - name: "Git Checkout (PR base)"
        uses: actions/checkout@v7
        with:
          submodules: true
          ref: ${{ github.event.pull_request.base.sha }}
          path: base

      - uses: ./.github/actions/bazel-setup
        with:
          disk-cache: apk

      - name: "Build APK from PR base SHA"
        working-directory: base
        run: |
          bazel build --config=ci //app
          mkdir -p ../out && cp bazel-bin/app/app.apk ../out/app-base-debug.apk

      - name: "Store Base APK"
        uses: actions/upload-artifact@v7
        with:
          name: base-apk
          path: out/app-base-debug.apk

  build-test-apk:
    name: "Build Test APK"
    runs-on: ubuntu-latest
    steps:
      - name: "Git Checkout"
        uses: actions/checkout@v7

      - uses: ./.github/actions/bazel-setup
        with:
          disk-cache: apk

      - name: "bazel build //app:instrumentation_tests_apk"
        run: |
          bazel build --config=ci //app:instrumentation_tests_apk
          mkdir -p out && cp bazel-bin/app/instrumentation_tests_apk.apk out/app-debug-androidTest.apk

      - name: "Store Test APK"
        uses: actions/upload-artifact@v7
        with:
          name: test-apk
          path: out/app-debug-androidTest.apk

  diff-apk-from-base:
    name: "Diff APK from Base"
    runs-on: ubuntu-latest
    if: github.secret_source == 'Actions' && github.ref_name != 'main'
    needs:
      - build-apk
      - build-base-apk
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: apk

      - uses: actions/download-artifact@v8
        with:
          name: base-apk

      - id: diffuse
        uses: usefulness/diffuse-action@v1
        with:
          old-file-path: app-base-debug.apk
          new-file-path: app-debug.apk

      - uses: peter-evans/find-comment@v4
        id: find-comment
        if: ${{ github.event.pull_request }}
        with:
          issue-number: ${{ github.event.pull_request.number }}
          body-includes: Diffuse output

      - uses: peter-evans/create-or-update-comment@v5
        if: ${{ github.event.pull_request }}
        with:
          body: |
            Diffuse output:

            ${{ steps.diffuse.outputs.diff-gh-comment }}
          edit-mode: replace
          comment-id: ${{ steps.find-comment.outputs.comment-id }}
          issue-number: ${{ github.event.pull_request.number }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-artifact@v7
        with:
          name: diffuse-output
          path: ${{ steps.diffuse.outputs.diff-file }}

  ui-tests:
    name: "Android UI Tests"
    runs-on: ubuntu-latest
    # emulator.wtf needs the EW_API_TOKEN secret, which Dependabot-triggered runs do not receive, so this job is skipped there.
    if: github.secret_source == 'Actions'
    needs:
      - build-apk
      - build-test-apk
    steps:
      - name: "Git Checkout"
        uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: apk

      - uses: actions/download-artifact@v8
        with:
          name: test-apk

      - name: "Run tests on emulator.wtf"
        uses: emulator-wtf/run-tests@v1
        with:
          api-token: ${{ secrets.EW_API_TOKEN }}
          app: app-debug.apk
          test: app-debug-androidTest.apk
          outputs-dir: build/test-results
          record-video: true

      - name: "Publish Test Report"
        uses: mikepenz/action-junit-report@v6
        if: always() # always run even if the tests fail
        with:
          check_name: "UI Test Report"
          report_paths: 'build/test-results/**/*.xml'

  auto-mobile-tests:
    name: "AutoMobile JUnit Tests"
    runs-on: ubuntu-latest
    # emulator.wtf needs the EW_API_TOKEN secret, which Dependabot-triggered runs do not receive, so this job is skipped there.
    if: github.secret_source == 'Actions'
    # Requires EW_API_TOKEN secret for the emulator.wtf adb session (closed alpha feature).
    # Contact support@emulator.wtf to request access to start-session.
    needs:
      - build-apk
    steps:
      - name: "Git Checkout"
        uses: actions/checkout@v7

      - name: "Setup Bun"
        uses: oven-sh/setup-bun@v2

      - name: "Install auto-mobile"
        shell: "bash"
        # Pin to match auto-mobile-junit-runner in gradle/libs.versions.toml.
        # The daemon/CLI and the runner must be the same version: a mismatch makes
        # the daemon disable the executePlan tool (version-compatibility gate) and
        # every AutoMobile plan fails. Bump both together.
        run: npm install -g @kaeawc/auto-mobile@0.0.67 --ignore-scripts

      - name: "Copy auto-mobile schema to workspace"
        shell: "bash"
        run: |
          mkdir -p "$GITHUB_WORKSPACE/schemas"
          cp /usr/local/lib/node_modules/@kaeawc/auto-mobile/schemas/test-plan.schema.json \
            "$GITHUB_WORKSPACE/schemas/test-plan.schema.json"

      - name: "Download app APK"
        uses: actions/download-artifact@v8
        with:
          name: apk

      - name: "Add Android platform tools to PATH"
        shell: "bash"
        run: echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      - name: "Install ew-cli"
        shell: "bash"
        run: |
          curl -fsSL \
            https://maven.emulator.wtf/releases/ew-cli \
            -o /usr/local/bin/ew-cli
          chmod +x /usr/local/bin/ew-cli

      - name: "Start emulator.wtf ADB session"
        shell: "bash"
        env:
          EW_API_TOKEN: ${{ secrets.EW_API_TOKEN }}
        run: |
          ew-cli start-session \
            --device model=Pixel2,version=33 \
            --adb \
            --max-time-limit 20m &
          echo "EW_SESSION_PID=$!" >> "$GITHUB_ENV"
          adb wait-for-device
          adb shell 'while [ "$(getprop sys.boot_completed)" != "1" ]; do sleep 2; done'

      - name: "Install app APK on emulator"
        shell: "bash"
        run: adb install app-debug.apk

      - name: "Start auto-mobile daemon"
        shell: "bash"
        run: |
          auto-mobile --daemon-mode &
          echo "AUTOMOBILE_DAEMON_PID=$!" >> "$GITHUB_ENV"
          sleep 3

      - name: "Pre-install CtrlProxy via observe"
        shell: "bash"
        run: auto-mobile --cli observe --platform android

      - name: "Run AutoMobile JUnit Tests"
        uses: ./.github/actions/gradle-task-run
        with:
          # Launch, lifecycle, and tab-navigation plans exercise the Nav3 shell of the jasonpearson.dev app.
          # Assertions target the bottom-nav chrome, not network content (CI has no Ghost key).
          # A package wildcard (rather than one --tests per class) keeps the artifact name this
          # action derives from gradle-tasks under GitHub's 256-character limit.
          gradle-tasks: >-
            :app:testDebugUnitTest
            --tests 'dev.jasonpearson.android.automobiletest.*'
          reuse-configuration-cache: false
          gradle-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: "Dump app launch diagnostics on failure"
        if: failure()
        shell: "bash"
        run: |
          echo "::group::crash buffer"
          adb logcat -d -b crash || true
          echo "::endgroup::"
          echo "::group::direct launch"
          adb shell am start -W -n dev.jasonpearson.android/.MainActivity || true
          sleep 5
          adb shell dumpsys activity activities | grep -E "mResumedActivity|topResumedActivity" || true
          echo "::endgroup::"
          echo "::group::logcat (AndroidRuntime / app)"
          adb logcat -d -b main,system,crash | grep -iE "AndroidRuntime|FATAL|jasonpearson|ActivityTaskManager" | tail -n 300 || true
          echo "::endgroup::"

      - name: "Stop emulator.wtf session and daemon"
        if: always()
        shell: "bash"
        run: |
          kill "$AUTOMOBILE_DAEMON_PID" 2>/dev/null || true
          kill "$EW_SESSION_PID" 2>/dev/null || true

      - name: "Publish Test Report"
        uses: mikepenz/action-junit-report@v6
        if: always()
        with:
          check_name: "AutoMobile Test Report"
          report_paths: 'app/build/test-results/**/*.xml'
