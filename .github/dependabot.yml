# Please see the documentation for all configuration options:
# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates

version: 2
registries:
  maven-google:
    type: maven-repository
    url: "https://dl.google.com/dl/android/maven2/"
  maven-central:
    type: maven-repository
    url: "https://repo.maven.apache.org/maven2/"
updates:
  - package-ecosystem: "gradle"
    directory: "/" # Location of package manifests
    target-branch: "main"
    schedule:
      interval: "daily"
      time: "08:00"
      timezone: "EST"
    registries:
      - maven-google
      - maven-central
  # Bazel modules in MODULE.bazel (bazel_dep). Maven artifacts listed in MODULE.bazel mirror
  # gradle/libs.versions.toml: when a Gradle update lands, bump the same artifact there and
  # repin with bazel/scripts/align_androidx.py.
  - package-ecosystem: "bazel"
    directory: "/"
    target-branch: "main"
    schedule:
      interval: "weekly"
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "main"
    schedule:
      interval: "weekly"
