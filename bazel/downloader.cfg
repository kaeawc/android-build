# Bazel's downloader config (.bazelrc: --downloader_config). Maven Central rate-limits bursts
# (429 Too Many Requests), and a fetch from an empty repository cache asks it for hundreds of
# artifacts at once: Bazel's 8 attempts per URL (~20 s) weren't enough on CI. So every Central
# download comes from Google's Cloud Storage mirror of Central first, and from Central itself if
# the mirror fails. Downloads are checked against the sha256 pinned in maven_install.json, so
# either source must serve the same bytes.
rewrite repo1\.maven\.org/maven2/(.*) maven-central.storage-download.googleapis.com/maven2/$1
rewrite (repo1\.maven\.org/maven2/.*) $1
