# yaml-language-server: $schema=https://unpkg.com/@kaeawc/auto-mobile/schemas/test-plan.schema.json
---
name: launch-app
description: Launch the jasonpearson.dev companion app and verify the bottom navigation renders
steps:
  - tool: launchApp
    appId: dev.jasonpearson.android
    clearAppData: true
    label: Launch the app with clean state

  - tool: observe
    waitFor:
      text: Articles
    label: Verify the Articles tab is visible in the bottom navigation

  - tool: observe
    waitFor:
      text: About
    label: Verify the About tab is visible in the bottom navigation

  - tool: terminateApp
    appId: dev.jasonpearson.android
    label: Terminate the app after test
