# yaml-language-server: $schema=https://unpkg.com/@kaeawc/auto-mobile/schemas/test-plan.schema.json
---
name: saved
description: Open the Saved screen from the Articles top bar on a fresh install and navigate back
steps:
  - tool: launchApp
    appId: dev.jasonpearson.android
    clearAppData: true
    label: Launch the app with clean state

  - tool: observe
    waitFor:
      text: Articles
    label: Wait for the bottom navigation to render

  - tool: tapOn
    action: tap
    text: Saved
    label: Open saved articles from the Articles top bar

  - tool: observe
    waitFor:
      text: No saved articles yet
    label: Verify the empty saved list on a fresh install

  - tool: tapOn
    action: tap
    text: Back
    label: Navigate back from Saved

  - tool: observe
    waitFor:
      text: Articles
    label: Verify the navigation shell is still showing

  - tool: terminateApp
    appId: dev.jasonpearson.android
    label: Terminate the app after test
