[versions]
build-android-buildTools = "37.0.0"
build-android-compileSdk = "37"
# Android 17 minor SDK release (API 37.2); Compose 1.13+ requires at least 37.1.
build-android-compileSdkMinor = "2"
build-android-minSdk = "27"
build-android-targetSdk = "37"
build-android-agp = "9.5.1"
# Uncomment to pin R8 version (e.g. for dev versions needed for kotlin metadata)
# build-android-r8 = "9.0.32"
build-android-desugar = "2.1.5"
build-kotlin = "2.4.21"
build-kotlin-language = "2.4"
build-kotlin-coroutines = "1.11.0"
build-kotlin-datetime = "0.8.0"
build-java-asm = "9.11.1"
# JDK that runs the build and compiles every module (Gradle daemon + javac/kotlinc toolchain).
build-java-toolchain = "27"
# Bytecode level emitted by javac/kotlinc. Kotlin 2.4.x tops out at JVM 26 (JVM 27 needs Kotlin 2.5).
build-java-target = "26"
build-gradle-dependencyAnalysis = "3.20.4"
build-gradle-graphAssertion = "2.9.1"
build-gradle-doctor = "0.12.1"
build-gradle-sortDependencies = "0.21.0"
build-gradle-triplet-play = "4.1.2"
build-artifactswap = "0.1.15"
androidx-core = "1.19.1"
androidx-activity-compose = "1.13.0"
androidx-compose-bom = "2026.11.01"
androidx-lifecycle = "2.11.1"
auto-mobile-junit-runner = "0.0.67"
androidx-browser = "1.10.0"
datastore = "1.3.0"
glance = "1.2.0"
jsoup = "1.24.1"
zxing = "3.5.4"

retrofit = "3.0.0"
okhttp = "5.5.1"
coil = "3.6.3"
kotlinx-serialization = "1.13.0"
navigation3 = "1.2.2"

test-junit = "4.13.2"
test-androidx-junit = "1.3.0"
test-androidx-espresso = "3.7.0"

metro = "1.6.0"
haze = "2.1.0"

[plugins]
dependencyAnalysis = { id = "com.autonomousapps.dependency-analysis", version.ref = "build-gradle-dependencyAnalysis" }
sortDependencies = { id = "com.squareup.sort-dependencies", version.ref = "build-gradle-sortDependencies" }
doctor = { id = "com.osacky.doctor", version.ref = "build-gradle-doctor" }
graphAssertion = { id = "com.jraska.module.graph.assertion", version.ref = "build-gradle-graphAssertion" }
publish = { id = "com.github.triplet.play", version.ref = "build-gradle-triplet-play" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "build-kotlin" }
android-library = { id = "com.android.library", version.ref = "build-android-agp" }
android-application = { id = "com.android.application", version.ref = "build-android-agp" }
metro = { id = "dev.zacsweers.metro", version.ref = "metro" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "build-kotlin" }

[libraries]
kgp = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "build-kotlin" }
agp = { module = "com.android.tools.build:gradle", version.ref = "build-android-agp" }
# Compose compiler Gradle plugin as a library so build-logic convention plugins can apply it by id.
compose-compiler-plugin = { module = "org.jetbrains.kotlin:compose-compiler-gradle-plugin", version.ref = "build-kotlin" }
artifactswap-publish-plugin = { module = "xyz.block.artifactswap:gradle-publish-plugin", version.ref = "build-artifactswap" }
artifactswap-gradle-plugin = { module = "xyz.block.artifactswap:gradle-plugin", version.ref = "build-artifactswap" }
artifactswap-gradle-utils = { module = "xyz.block.artifactswap:gradle-utils", version.ref = "build-artifactswap" }
# Uncomment to pin R8 version
# r8 = { module = "com.android.tools:r8", version.ref = "build-android-r8" }
kotlin-stdlib-jdk8 = { module = "org.jetbrains.kotlin:kotlin-stdlib-jdk8", version.ref = "build-kotlin" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "build-kotlin-coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "build-kotlin-coroutines" }
kotlinx-datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "build-kotlin-datetime" }

retrofit = { module = "com.squareup.retrofit2:retrofit", version.ref = "retrofit" }
# Retrofit's first-party kotlinx.serialization converter (replaces the deprecated
# com.jakewharton.retrofit:retrofit2-kotlinx-serialization-converter).
retrofit-serialization-converter = { module = "com.squareup.retrofit2:converter-kotlinx-serialization", version.ref = "retrofit" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
okhttp-logging-interceptor = { module = "com.squareup.okhttp3:logging-interceptor", version.ref = "okhttp" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }

navigation3-runtime = { module = "androidx.navigation3:navigation3-runtime", version.ref = "navigation3" }
navigation3-ui = { module = "androidx.navigation3:navigation3-ui", version.ref = "navigation3" }
lifecycle-viewmodel-navigation3 = { module = "androidx.lifecycle:lifecycle-viewmodel-navigation3", version.ref = "androidx-lifecycle" }

coil-compose = { module = "io.coil-kt.coil3:coil-compose", version.ref = "coil" }
coil-network-okhttp = { module = "io.coil-kt.coil3:coil-network-okhttp", version.ref = "coil" }
coil-svg = { module = "io.coil-kt.coil3:coil-svg", version.ref = "coil" }

metro-runtime = { module = "dev.zacsweers.metro:runtime", version.ref = "metro" }
metro-compiler = { module = "dev.zacsweers.metro:compiler", version.ref = "metro" }

haze = { module = "dev.chrisbanes.haze:haze", version.ref = "haze" }
haze-blur = { module = "dev.chrisbanes.haze:haze-blur", version.ref = "haze" }
haze-blur-materials = { module = "dev.chrisbanes.haze:haze-blur-materials", version.ref = "haze" }

asm-bom = { module = "org.ow2.asm:asm-bom", version.ref = "build-java-asm" }
desugar = { module = "com.android.tools:desugar_jdk_libs", version.ref = "build-android-desugar" }

androidx-core = { module = "androidx.core:core-ktx", version.ref = "androidx-core" }
androidx-lifecycle-runtime = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "androidx-lifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "androidx-lifecycle" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activity-compose" }
androidx-browser = { module = "androidx.browser:browser", version.ref = "androidx-browser" }
datastore-preferences-core = { module = "androidx.datastore:datastore-preferences-core", version.ref = "datastore" }
glance-appwidget = { module = "androidx.glance:glance-appwidget", version.ref = "glance" }
glance-material3 = { module = "androidx.glance:glance-material3", version.ref = "glance" }
jsoup = { module = "org.jsoup:jsoup", version.ref = "jsoup" }
zxing-core = { module = "com.google.zxing:core", version.ref = "zxing" }

compose-bom = { module = "androidx.compose:compose-bom", version.ref = "androidx-compose-bom" }
compose-foundation = { group = "androidx.compose.foundation", name = "foundation" }
compose-material-icons = { group = "androidx.compose.material", name = "material-icons-extended" }
compose-runtime = { group = "androidx.compose.runtime", name = "runtime" }
compose-ui-core = { group = "androidx.compose.ui", name = "ui" }
compose-ui-util = { group = "androidx.compose.ui", name = "ui-util" }
compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
compose-ui-junit = { group = "androidx.compose.ui", name = "ui-test-junit4" }
compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
compose-material = { group = "androidx.compose.material3", name = "material3" }
compose-material-adaptive-navigation-suite = { group = "androidx.compose.material3", name = "material3-adaptive-navigation-suite" }
auto-mobile-junit-runner = { module = "dev.jasonpearson.auto-mobile:auto-mobile-junit-runner", version.ref = "auto-mobile-junit-runner" }

junit = { module = "junit:junit", version.ref = "test-junit" }
androidx-junit = { module = "androidx.test.ext:junit", version.ref = "test-androidx-junit" }
androidx-espresso = { module = "androidx.test.espresso:espresso-core", version.ref = "test-androidx-espresso" }

[bundles]
kotlin = [
    "kotlin-stdlib-jdk8",
    "kotlinx-coroutines-core",
    "kotlinx-datetime"
]
network = [
    "retrofit",
    "retrofit-serialization-converter",
    "okhttp",
    "okhttp-logging-interceptor",
    "kotlinx-serialization-json"
]
compose-ui = [
    "androidx-activity-compose",
    "compose-ui-core",
    "compose-ui-util",
    "compose-ui-graphics",
    "compose-ui-tooling",
    "compose-ui-tooling-preview",
    "compose-material"
]
compose-ui-espresso-test = [
    "androidx-junit",
    "compose-ui-junit",
    "androidx-espresso"
]
compose-ui-debug = [
    "compose-ui-tooling",
    "compose-ui-test-manifest"
]
unit-test = [
    "junit",
    "kotlinx-coroutines-test"
]
